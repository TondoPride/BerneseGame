body.touch #touch{display:block}

.b{position:absolute;width:48px;height:48px;border-radius:50%;border:1.5px solid rgba(255,255,255,.28);background:rgba(20,16,12,.32);color:rgba(240,240,240,.85);font:bold 10px "Times New Roman",Georgia,serif;letter-spacing:.3px;pointer-events:auto;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1}
.b small{display:none}
.b.on{background:rgba(232,201,122,.6);color:#000}
#bA{right:0;top:47px;border-color:rgba(95,191,106,.7)}
#bX{left:0;top:47px;border-color:rgba(90,154,216,.7)}
#bB{left:47px;bottom:0;border-color:rgba(216,90,90,.7)}
#bY{left:47px;top:0;border-color:rgba(232,201,122,.7)}

body.jax #bJ{display:flex}
body.touch.fill canvas{max-height:none}
body.touch:not(.inplay) #stickZone{pointer-events:none}
body.touch:not(.inplay) #stick{opacity:0}
body.touch.menu #btns,body.touch.menu #bJ{display:none}
#topbar{position:absolute;right:calc(env(safe-area-inset-right) + 10px);top:calc(env(safe-area-inset-top) + 10px);display:flex;gap:8px;pointer-events:auto}
.s{width:34px;height:34px;border-radius:8px;opacity:.7;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.55);color:#ddd;font-size:17px;padding:0;touch-action:manipulation}
#rotate{position:fixed;inset:0;background:#000;color:#d8cfb8;display:none;align-items:center;justify-content:center;flex-direction:column;font:20px "Times New Roman",Georgia,serif;text-align:center;z-index:5;padding:24px;gap:14px}
#rotate .ic{font-size:56px;animation:rot 2.2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}

function mtof(m){return 440*Math.pow(2,(m-69)/12);}
function mpad(m,t,dur,type,vol,cut,att){const o=AC.createOscillator();o.type=type;o.frequency.value=mtof(m);const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.linearRampToValueAtTime(0.0001,t+dur);let n=o;if(cut){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=cut;o.connect(f);n=f;}n.connect(g);g.connect(musG);o.start(t);o.stop(t+dur+0.05);}
